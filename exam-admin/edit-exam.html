<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Examination / Question Set | Anowar Creation</title><link rel="stylesheet" href="../assets/exam/style.css"><link rel="stylesheet" href="../assets/exam/admin-dark.css"><link rel="stylesheet" href="../assets/exam/admin-light.css"><link rel="stylesheet" href="../assets/exam/admin-theme.css?v=theme-contrast-v7"></head><body><div class="wrap"><header class="topbar"><a href="dashboard.html?view=exams"><img class="brand" src="../assets/exam/anowar-creation-logo.png" alt="Anowar Creation"></a><div class="toplinks"><a class="btn ghost" href="dashboard.html?view=exams">← Back to Admin</a><button id="signOut" class="secondary" type="button">Sign out</button></div></header><main class="admin-content" style="max-width:1100px;margin:28px auto"><section class="card"><span class="eyebrow">ANOWAR CREATION · ADMIN</span><h1>Edit Examination / Question Set</h1><p class="muted">Edit fields below and save your changes.</p><form id="editExamForm"><input id="recordId" type="hidden"><div class="grid2"><div class="field"><label for="title">Exam / Set Name</label><input id="title" required maxlength="120"></div><div class="field"><label for="subject">Subject</label><input id="subject" required maxlength="80"></div></div><div class="grid2"><div class="field"><label for="setNumber">Question Set Number</label><select id="setNumber" required><option value="1">Set 1</option><option value="2">Set 2</option><option value="3">Set 3</option><option value="4">Set 4</option><option value="5">Set 5</option><option value="6">Set 6</option><option value="7">Set 7</option><option value="8">Set 8</option></select></div><div class="field"><label for="examCode">Exam Code</label><input id="examCode" required maxlength="40"></div></div><div class="grid2"><div class="field"><label for="duration">Duration (minutes)</label><input id="duration" type="number" min="1" max="600" required></div><div class="field"><label for="pass">Pass percentage</label><input id="pass" type="number" min="0" max="100" required></div></div><div class="grid2"><div class="field"><label for="positive">Marks for correct answer</label><input id="positive" type="number" min="0" step="0.25" required></div><div class="field"><label for="negative">Penalty for wrong answer</label><input id="negative" type="number" min="0" step="0.25" required></div></div><div class="field"><label for="instructions">Student instructions</label><textarea id="instructions" rows="4"></textarea></div><div class="field"><label for="published">Release status</label><select id="published"><option value="false">Closed — do not accept attempts</option><option value="true">Published — accept attempts</option></select></div><button type="submit">Save Exam Changes</button><p id="status" class="muted" role="status"></p></form></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="../assets/exam/admin-edit-pages.js"></script><script src="../assets/exam/admin-theme.js?v=theme-toggle-v1"></script></body></html>
